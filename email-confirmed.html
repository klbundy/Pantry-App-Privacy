<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Email Confirmed — RIQUO</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f5f0;
      color: #222;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 36px 28px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
    }
    .icon { font-size: 52px; margin-bottom: 8px; }
    h1 { font-size: 24px; margin: 8px 0 12px; }
    p { font-size: 16px; line-height: 1.5; color: #555; margin: 0; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon" id="icon">✅</div>
    <h1 id="title">Email confirmed!</h1>
    <p id="message">You're all set. Go back to the RIQUO app and sign in.</p>
  </div>
  <script>
    // Supabase sends people here after they tap the link in a sign-up email.
    // If the link was expired or already used, it adds an error to the URL.
    var params = new URLSearchParams(location.hash.slice(1) || location.search.slice(1));
    if (params.get('error') || params.get('error_code')) {
      document.getElementById('icon').textContent = '⚠️';
      document.getElementById('title').textContent = 'This link has expired';
      document.getElementById('message').textContent =
        'Confirmation links only work once and expire after an hour. Open RIQUO and sign in — ' +
        'if your email still needs confirming, the app can send you a new code.';
    }
  </script>
</body>
</html>
